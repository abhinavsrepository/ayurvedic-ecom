version: '3.8'

services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ayurveda-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ayurveda-network

  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: ayurveda-postgres
    environment:
      POSTGRES_DB: ayurveda_admin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ayurveda-network

  # NestJS Backend
  backend:
    build:
      context: ../ayurveda-api
      dockerfile: Dockerfile
    container_name: ayurveda-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ayurveda_admin
      ML_SERVICE_URL: http://ml-service:5000
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - ayurveda-network

  # Python ML Service
  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    container_name: ayurveda-ml
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      PYTHONUNBUFFERED: 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ayurveda-network

  # Next.js Frontend
  frontend:
    build:
      context: ../ayurveda-shop
      dockerfile: Dockerfile
    container_name: ayurveda-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_ML_URL: http://localhost:5000
    ports:
      - "3001:3000"
    depends_on:
      - backend
      - ml-service
    networks:
      - ayurveda-network

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  ayurveda-network:
    driver: bridge
